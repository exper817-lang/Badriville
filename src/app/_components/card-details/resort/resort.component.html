<section class="bg-cream" data-testid="resort-section">
<div class="container" style="padding-top: 60px;padding-bottom: 60px;">
  <div class="section-header text-center">
    <p class="premium-subtitle">Luxury Accommodation</p>
    <h2>Badriville Resort</h2>
    <div class="premium-divider"></div>
  </div>
  <div class="row small-gutters categories_grid">
    <div class="col-sm-12 col-md-6 wow zoomIn" data-wow-delay="0.3s">
      <a href="#" class="more-img-padding speacial-product-img image-overlay">

        <img src="../../../../assets/img/home_resorts/image_1.jpg" alt="Badriville Resort View 1"
          class="img-fluid resort-slides resort-slides-hidden more-img speacial-product-img"
          style="width: 100%; height: 450px; object-fit: cover;">
        <img src="../../../../assets/img/home_resorts/image_2.jpg" alt="Badriville Resort View 2"
          class="img-fluid resort-slides resort-slides-hidden more-img speacial-product-img"
          style="width: 100%; height: 450px; object-fit: cover;">
        <img src="../../../../assets/img/home_resorts/image_3.jpg" alt="Badriville Resort View 3"
          class="img-fluid resort-slides resort-slides-hidden more-img speacial-product-img"
          style="width: 100%; height: 450px; object-fit: cover;">
        <img src="../../../../assets/img/home_resorts/image_4.jpg" alt="Badriville Resort View 4"
          class="img-fluid resort-slides resort-slides-hidden more-img speacial-product-img"
          style="width: 100%; height: 450px; object-fit: cover;">
        <img src="../../../../assets/img/home_resorts/image_5.jpg" alt="Badriville Resort View 5"
          class="img-fluid resort-slides resort-slides-hidden more-img speacial-product-img"
          style="width: 100%; height: 450px; object-fit: cover;">

      </a>
    </div>
    <div class="col-sm-12 col-md-6" id="padding-left" style="padding-left: 3rem;">
      <h4 class="text-gold" style="font-family: var(--font-subheading); font-size: 1.125rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1rem;">Experience Excellence</h4>
      <p style="font-size: 1.125rem; line-height: 1.8; color: var(--color-gray); margin-bottom: 2rem;">
        Badriville Resort and Nature Camp - Badrinath offers an unparalleled blend of luxury and natural beauty, where every moment becomes a cherished memory.
      </p>
      <ul class="list_order" style="list-style: none; padding: 0;" *ngFor="let item of resortStayList; let i=index;">
        <li style="padding: 0.75rem 0; border-bottom: 1px solid var(--color-border); font-size: 1rem; color: var(--color-gray);"><span style="display: inline-block; width: 30px; height: 30px; background: var(--color-primary-gold); color: white; text-align: center; line-height: 30px; border-radius: 50%; margin-right: 1rem; font-weight: 600;">{{i+1}}</span> {{item.benefits}}</li>
      </ul>
      <div style="margin-top: 2.5rem;">
        <button class="btn-primary" (click)="resorts()" style="margin-right: 1rem; margin-bottom: 1rem;">More Details</button>
        <button class="btn-secondary" (click)="contactUs()" style="margin-bottom: 1rem;">Contact Us</button>
      </div>
    </div>
  </div>
</div>
</section>
